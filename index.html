<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{
      font-family: Arial;
      background:#f4f4f4;
      padding:40px;
    }

    .box{
      max-width:500px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:10px;
    }

    h1{
      text-align:center;
    }

    input, button{
      width:100%;
      padding:12px;
      margin-bottom:10px;
      box-sizing:border-box;
    }

    button{
      cursor:pointer;
    }

    a{
      display:block;
      text-align:center;
      margin-top:10px;
    }
  </style>
</head>
<body>

<div class="box">

  <h1>Novo Cadastro</h1>

  <input type="text" id="nome" placeholder="Nome">
  <input type="text" id="servico" placeholder="Serviço">
  <input type="date" id="data">
  <input type="text" id="whatsapp" placeholder="WhatsApp">

  <button onclick="salvar()">Salvar</button>

</div>

<script>

const supabaseUrl = 'https://udttsosmammxxzjzztrp.supabase.co';

const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkdHRzb3NtYW1teHh6anp6dHJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNDM4MzQsImV4cCI6MjA5MzkxOTgzNH0.Dtb5vE0c8dIa_Z5eyl4X32k-3v7zgMjEackBqp0P1lI';

const client = supabase.createClient(supabaseUrl, supabaseKey);

async function salvar(){

  const nome = document.getElementById('nome').value;
  const servico = document.getElementById('servico').value;
  const data = document.getElementById('data').value;
  const whatsapp = document.getElementById('whatsapp').value;

  const { error } = await client
    .from('cadastros')
    .insert([
      {
        nome: nome,
        servico: servico,
        data: data,
        whatsapp: whatsapp
      }
    ]);

  if(error){
    alert(JSON.stringify(error));
    console.log(error);
  }else{
    alert('Cadastro salvo com sucesso');

    document.getElementById('nome').value = '';
    document.getElementById('servico').value = '';
    document.getElementById('data').value = '';
    document.getElementById('whatsapp').value = '';
  }

}

</script>

</body>
</html>
